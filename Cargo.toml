[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/chain",
    "crates/server",
    "crates/indexer",
    "crates/sdk",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LunarVagabond/avalon-protocol"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "macros"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
anyhow = "1"
hex = "0.4"
dotenvy = "0.15"
webauthn-rs = { version = "0.5", features = ["resident-key-support", "danger-allow-state-serialisation", "conditional-ui"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
url = { version = "2", features = ["serde"] }
passkey-types = "0.5"
passkey-client = "0.5"
passkey-authenticator = { version = "0.5", features = ["testable"] }
