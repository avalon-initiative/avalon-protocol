[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/chain",
    "crates/server",
    "crates/indexer",
    "crates/sdk",
    "crates/schema-derive",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LunarVagabond/avalon-protocol"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
# issue #363: ConcurrencyLimitLayer (AVALON_MAX_CONCURRENT_REQUESTS) in the
# same ServiceBuilder chain tower-http's TraceLayer/CorsLayer already live
# in.
tower = { version = "0.5", features = ["limit"] }
# GCRA-based rate limiting (AVALON_RATE_LIMIT_PER_MINUTE), keyed by
# integrator key id with an IP fallback for pre-auth endpoints — issue
# #363. tonic support disabled; this is an axum-only server.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "macros"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23"
anyhow = "1"
hex = "0.4"
dotenvy = "0.15"
webauthn-rs = { version = "0.5", features = ["resident-key-support", "danger-allow-state-serialisation", "conditional-ui"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde"] }
url = { version = "2", features = ["serde"] }
passkey-types = "0.5"
passkey-client = "0.5"
passkey-authenticator = { version = "0.5", features = ["testable"] }
# A local mock HTTP server for the SDK's own retry/error-mapping tests
# (issue #47) — these need to control exact response sequences (a 503 then
# a 200, a hung connection for the timeout case) that no `--ignored` test
# against the real `avalon-server` could deterministically produce.
wiremock = "0.6"
# passkey-client's default `Client<S, U, P, F>` TLD-verifier type parameter
# (`public_suffix::PublicSuffixList`) isn't re-exported from passkey-client
# itself — naming the full virtual-client type in an integration test (see
# crates/server/tests/passkeys.rs) needs this as a direct dependency too.
public-suffix = "0.1"
# rust-protobuf project, version-aligned (issue #384's amendment): parses
# untrusted `.proto` source text at runtime (no `protoc` binary dependency)
# and builds/reads dynamic messages against the resulting descriptor.
protobuf = "3.7.2"
protobuf-parse = "3.7.2"
protobuf-json-mapping = "3.7.2"
# issue #386: `avalon-schema-derive`'s `#[derive(AvalonSchema)]`
# proc-macro, generating `.proto` text from a Rust struct's own fields
# (syn parses the struct, quote emits the generated `impl` block).
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# `protobuf_parse::Parser`'s only public API reads `.proto` source from a
# filesystem path (its in-memory `ProtoPathResolver` trait is crate-private,
# not usable from a dependent crate) — a scoped, auto-cleaned temp file per
# parse request is the plumbing for that, not a new persistent artifact.
tempfile = "3"
# Issue #368: real semver ordering for node-to-node protocol version
# comparison (MIN_SUPPORTED_PEER_VERSION / AVALON_MIN_PEER_VERSION), rather
# than string comparison — already present transitively (many crates in
# this workspace depend on it), promoted to a direct dependency here.
semver = "1"
