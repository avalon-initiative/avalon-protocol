name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A few details help us reproduce it quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: e.g. `avalon create-identity` panics when run against an empty database
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: e.g. Identity creation and its ledger entry to succeed atomically
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
      value: |
        1.
        2.
    validations:
      required: true

  # Only keep this field if the project is a multi-crate/multi-package
  # workspace where "which part broke" is genuinely ambiguous. Delete it
  # for a single-package project.
  - type: input
    id: component
    attributes:
      label: Affected component
      placeholder: e.g. crates/server, crates/chain, apps/hub, bindings/csharp

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.1.0 or main @ abc1234

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Rust toolchain (rustc --version) / Node version / .NET SDK version (whichever applies):
        Against a local Postgres, `make test-live`, or something else:
