name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A few details help us reproduce it quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: e.g. <<one concrete example of the bug>>
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: e.g. <<what should have happened instead>>
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
      value: |
        1.
        2.
    validations:
      required: true

  # Only keep this field if the project is a multi-crate/multi-package
  # workspace where "which part broke" is genuinely ambiguous. Delete it
  # for a single-package project.
  - type: input
    id: component
    attributes:
      label: Affected component
      placeholder: e.g. <<name of the crate/package/module>>

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.1.0 or main @ abc1234

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        <<Toolchain/runtime version>>:
        Deployment mode (if relevant):
