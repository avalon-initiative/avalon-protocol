name: Feature request
description: Suggest an improvement or new capability
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: does this keep a game fully sovereign over its own world,
        economy, and rules, giving Avalon only the connective infrastructure between
        games? See the [Guiding Principles](https://github.com/avalon-initiative/avalon-protocol/blob/main/docs/stakeholders/Proposal.md#30-guiding-principles)
        and the [architecture tests](https://github.com/avalon-initiative/avalon-protocol/blob/main/docs/projects/backend-server/architecture/README.md#architecture-tests).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: e.g. A game wants to know which of a user's guildmates are online without polling presence per-friend
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach (optional)
      placeholder: Rough ideas welcome.

  # Delete this whole block if the project has no scope/design filter to check
  # feature requests against.
  - type: checkboxes
    id: acceptance
    attributes:
      label: Feature filter
      options:
        - label: This keeps games sovereign over their own world/economy/rules and doesn't give Avalon authority it doesn't need.
          required: true
