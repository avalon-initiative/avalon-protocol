name: Release

# Pushing a v<X.Y.Z>[-title] tag (created by `make release-tag`) builds the
# avalon-server and avalon binaries for every platform, attests their build
# provenance, creates one GitHub Release, and publishes a multi-arch container
# image assembled from those same binaries. This is release-time cost, not
# PR-time cost: it does not run automatically on a PR. A manual dispatch runs
# the same full pipeline but only builds and uploads workflow artifacts (and,
# for the image, builds and smoke-tests it locally); it never attests,
# publishes, or pushes an image, whatever dry_run says — use it to exercise
# the pipeline deliberately before actually tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload workflow artifacts only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          # Windows support is deferred, not abandoned — the server is
          # Linux-first for now. Re-enable once it's prioritized again.
          # - target: x86_64-pc-windows-msvc
          #   runner: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a tag on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to release."; exit 1; }
          bash scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          # Git Bash's own /usr/bin (with Git's bundled, module-incomplete perl)
          # is baked into this shell and outranks Strawberry Perl on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/bin:$PATH"
          fi
          cargo build --release --locked -p avalon-server --features vendored-openssl
          cargo build --release --locked -p avalon-cli --no-default-features --features vendored-openssl

      - name: Build (bundled variant, Linux only)
        # avalon-server-bundled: the same server, plus a managed embedded
        # Postgres (issue #990) — a second, separate artifact, never part
        # of the plain avalon-server binary above. Linux only for now,
        # matching #990's own acceptance criteria; not built on macOS/Windows.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release --locked -p avalon-server --bin avalon-server-bundled \
            --features bundled-postgres,vendored-openssl

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n1)"
          name="avalon-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/avalon-server target/release/avalon LICENSE README.md "dist/${name}/"
          strip "dist/${name}/avalon-server" "dist/${name}/avalon"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

          if [ "$RUNNER_OS" = "Linux" ]; then
            bundled_name="avalon-server-bundled-${version}-${{ matrix.target }}"
            mkdir -p "dist/${bundled_name}"
            cp target/release/avalon-server-bundled LICENSE README.md "dist/${bundled_name}/"
            strip "dist/${bundled_name}/avalon-server-bundled"
            tar -C dist -czf "dist/${bundled_name}.tar.gz" "${bundled_name}"
            rm -rf "dist/${bundled_name}"
          fi
          ls -l dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -notmatch '\[workspace\.package\][^\[]*?version\s*=\s*"([^"]+)"') { throw "workspace version not found in Cargo.toml" }
          $version = $Matches[1]
          $name = "avalon-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/avalon-server.exe, target/release/avalon.exe, LICENSE, README.md -Destination "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
          Get-ChildItem dist

      - name: Smoke test the packaged binaries (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n1)"
          tar -C dist -xzf "dist/avalon-${version}-${{ matrix.target }}.tar.gz"
          dir="dist/avalon-${version}-${{ matrix.target }}/"
          ("${dir}avalon" 2>&1 || true) | grep -q "^usage: avalon"
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L "${dir}avalon-server" | tee /dev/stderr | { ! grep -q 'libssl'; }
          else
            ldd "${dir}avalon-server" | tee /dev/stderr | { ! grep -q 'libssl'; }
          fi

          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -C dist -xzf "dist/avalon-server-bundled-${version}-${{ matrix.target }}.tar.gz"
            bundled_dir="dist/avalon-server-bundled-${version}-${{ matrix.target }}/"
            ldd "${bundled_dir}avalon-server-bundled" | tee /dev/stderr | { ! grep -q 'libssl'; }
          fi

      - name: Smoke test the packaged binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Both binaries below are meant to exit non-zero; without this, pwsh
          # 7.3+ auto-throws on any non-zero native exit code before the
          # script can inspect it.
          $PSNativeCommandUseErrorActionPreference = $false
          Expand-Archive -Path dist/avalon-*.zip -DestinationPath dist -Verbose
          $dir = (Get-ChildItem -Path dist -Directory -Filter 'avalon-*' | Select-Object -First 1).FullName
          Write-Host "dir = $dir"
          if (-not $dir) { throw "no extracted avalon-* directory found under dist/" }
          Get-ChildItem $dir

          try {
            $out = & "$dir\avalon.exe" 2>&1 | Out-String
            Write-Host "avalon.exe exit code: $LASTEXITCODE"
            Write-Host "avalon.exe output: $out"
          } catch {
            Write-Host "avalon.exe invocation threw: $_"
            throw
          }
          if ($out -notmatch '^usage: avalon') { throw "unexpected avalon.exe output: $out" }

          # A dynamically-linked libssl would fail to load before this panic is ever reached.
          try {
            $serverOut = & "$dir\avalon-server.exe" 2>&1 | Out-String
            Write-Host "avalon-server.exe exit code: $LASTEXITCODE"
            Write-Host "avalon-server.exe output: $serverOut"
          } catch {
            Write-Host "avalon-server.exe invocation threw: $_"
            throw
          }
          if ($serverOut -notmatch 'DATABASE_URL must be set') { throw "avalon-server.exe did not fail with the expected DATABASE_URL panic: $serverOut" }

          # Both binaries above deliberately exit non-zero; without this, the
          # Actions pwsh runner fails the step on whichever $LASTEXITCODE the
          # last native command left behind, regardless of the assertions above.
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: avalon-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Checksums, attestation and release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avalon-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        # *.zip is currently always empty (no Windows target in the matrix)
        # — nullglob keeps that from being passed to sha256sum as a literal,
        # unmatched pattern and failing the whole step.
        run: |
          shopt -s nullglob
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the release files as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    name: Validate compose files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Provide a .env for compose to read
        run: cp .env.compose.example .env

      - name: docker compose config (published image, default + redis)
        run: docker compose -f docker-compose.yml -f docker-compose.redis.yml --profile stack config -q

      - name: docker compose config (from-source override)
        run: docker compose -f docker-compose.yml -f docker-compose.source.yml --profile stack config -q

  image:
    name: Container image (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            arch: arm64
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: avalon-${{ matrix.target }}
          path: dist

      - name: Assemble the image build context from the release tarball
        run: |
          # Excludes avalon-server-bundled-*.tar.gz (issue #990) — a glob
          # here would match both tarballs once that one's uploaded
          # alongside this one under the same artifact name.
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n1)"
          tar -C dist -xzf "dist/avalon-${version}-${{ matrix.target }}.tar.gz"
          dir="dist/avalon-${version}-${{ matrix.target }}/"
          mkdir -p image-ctx
          cp "${dir}avalon-server" "${dir}avalon" image-ctx/
          cp Dockerfile.release image-ctx/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (local, for the smoke test below)
        uses: docker/build-push-action@v6
        with:
          context: image-ctx
          platforms: linux/${{ matrix.arch }}
          tags: avalon-server-smoke:${{ matrix.arch }}
          load: true
          provenance: false
          sbom: false

      - name: Smoke-test the image
        run: |
          docker network create avalon-smoke
          docker run -d --name avalon-smoke-postgres --network avalon-smoke \
            -e POSTGRES_USER=avalon -e POSTGRES_PASSWORD=avalon -e POSTGRES_DB=avalon \
            postgres:16
          for i in $(seq 1 30); do
            docker exec avalon-smoke-postgres pg_isready -U avalon -d avalon && break
            sleep 2
          done
          docker run -d --name avalon-smoke-server --network avalon-smoke -p 18080:8080 \
            -e DATABASE_URL=postgres://avalon:avalon@avalon-smoke-postgres:5432/avalon \
            -e AVALON_NETWORK_ID=avalon-image-smoke \
            -e AVALON_SERVER_ADDR=0.0.0.0:8080 \
            -e AVALON_WEBAUTHN_RP_ID=localhost \
            -e AVALON_WEBAUTHN_ORIGIN=http://localhost:8080 \
            avalon-server-smoke:${{ matrix.arch }}
          ok=
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/nodes/discover; then ok=1; break; fi
            sleep 2
          done
          docker logs avalon-smoke-server
          [ -n "$ok" ] || { echo "avalon-server never answered /nodes/discover"; exit 1; }

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        if: github.ref_type == 'tag'
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: image-ctx
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Save this architecture's pushed digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build_push.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*.txt
          if-no-files-found: error

  image-publish:
    name: Publish the multi-arch image
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        id: manifest
        run: |
          refs=()
          for f in /tmp/digests/*.txt; do
            refs+=("${IMAGE}@$(cat "$f")")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${IMAGE}:latest" \
            "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{ json .Manifest }}' | jq -r '.digest')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
