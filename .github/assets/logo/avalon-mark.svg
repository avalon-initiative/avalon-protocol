<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- Avalon primary mark (.vscode/mocks/IconMock.png's "Mark (Standalone)"):
       a faceted gem/diamond built from six triangles using the brand
       palette in the UI library's tokens.css (#310/#311) - replaces
       the solid-color placeholder `tauri icon` generated before any real
       branding existed (see the hub-app Tauri build-fix commit this
       replaces). `tauri icon avalon-hub/apps/hub-app/src-tauri/app-icon.svg` is
       the source of truth for every generated size in ./icons/. -->
  <polygon points="50,8 12,38 50,50" fill="#22D3EE" />
  <polygon points="50,8 50,50 88,38" fill="#E8F0FF" />
  <polygon points="12,38 30,62 50,50" fill="#4F88FF" />
  <polygon points="50,50 70,62 88,38" fill="#885CF6" />
  <polygon points="30,62 50,92 50,50" fill="#2B3A66" />
  <polygon points="50,50 50,92 70,62" fill="#4A2E8C" />
</svg>
