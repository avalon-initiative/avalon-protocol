version: 2

updates:
  # Rust workspace: crates/ (protocol, chain, indexer, server, sdk, cli).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # JS/TS npm workspace rooted here: apps/hub, apps/mobile-hub, packages/ui.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keeps the workflow files themselves patched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      actions-all:
        patterns: ["*"]
