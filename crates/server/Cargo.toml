[package]
name = "avalon-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Avalon's network-facing API/auth/realtime service. The backend the hub, mobile-hub, and games all talk to — never bundled into a client app's own backend."
default-run = "avalon-server"

[dependencies]
avalon-protocol = { path = "../protocol" }
avalon-chain = { path = "../chain" }
avalon-indexer = { path = "../indexer" }
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
tower-http.workspace = true
sqlx.workspace = true
rand.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
webauthn-rs.workspace = true
ed25519-dalek.workspace = true
url.workspace = true
hex.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
passkey-types.workspace = true
passkey-client.workspace = true
passkey-authenticator.workspace = true
public-suffix.workspace = true
avalon-sdk = { path = "../sdk" }

[[bin]]
name = "avalon-server"
path = "src/main.rs"
