[package]
name = "avalon-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Avalon's network-facing API/auth/realtime service. The backend the hub, hub-app, and games all talk to — never bundled into a client app's own backend."
default-run = "avalon-server"

[dependencies]
avalon-protocol = { path = "../protocol" }
avalon-chain = { path = "../chain" }
avalon-indexer = { path = "../indexer" }
async-trait.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
# Direct deps (otherwise only pulled in transitively through axum) so
# `crate::serve` can configure hyper's HTTP/1 connection builder directly —
# `axum::serve` itself exposes no way to set a header-read timeout.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-http.workspace = true
tower.workspace = true
tower_governor.workspace = true
governor.workspace = true
ipnet.workspace = true
sqlx.workspace = true
rand.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
avalon-devenv.workspace = true
webauthn-rs.workspace = true
ed25519-dalek.workspace = true
url.workspace = true
hex.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
protobuf.workspace = true
protobuf-parse.workspace = true
protobuf-json-mapping.workspace = true
tempfile.workspace = true
semver.workspace = true
redis.workspace = true
libp2p = { version = "0.57.0", features = ["tcp", "noise", "yamux", "kad", "identify", "tokio", "macros"] }
sysinfo.workspace = true
# Issue #663: `crate::realtime_proxy` dials a remote Realtime node's own
# `/ws/presence`/`/ws/messages` as a real websocket client — promoted from
# a dev-only dependency (where issue #539 first pulled it in for
# `crates/server/tests/realtime_relay.rs`) to a real one, since proxying is
# now part of `avalon-server`'s own runtime behavior, not just its tests.
tokio-tungstenite = "0.30"
futures-util.workspace = true
utoipa.workspace = true
sha2 = "0.11"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "io-util"] }
passkey-types.workspace = true
passkey-client.workspace = true
passkey-authenticator.workspace = true
public-suffix.workspace = true
# Issue #636: a mocked remote node for the cross-shard-fetch tamper-
# detection test — already used the same way by `crates/sdk`.
wiremock.workspace = true
# Issue #780: `tests/connections.rs` drives a real SDK client against this
# server to exercise capability enforcement end to end — test-only, not a
# production dependency (the production `bundled_trust_anchors()` use this
# crate had moved to `avalon_protocol::network_trust` by #780).
# The Rust SDK lives in avalon-sdks and tracks its main branch until it is pinned to a release.
avalon-sdk = { git = "https://github.com/avalon-initiative/avalon-sdks", branch = "main" }

[[bin]]
name = "avalon-server"
path = "src/main.rs"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"
