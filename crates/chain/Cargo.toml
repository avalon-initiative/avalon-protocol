[package]
name = "avalon-chain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Avalon's trust and attestation ledger. Milestone 1: a hash-chained, append-only Postgres-backed SettlementProvider — not a blockchain. See GitHub issues #68 and #70."

[dependencies]
avalon-protocol = { path = "../protocol" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
thiserror.workspace = true
sqlx.workspace = true
sha2 = "0.10"
hex.workspace = true
# Only pulled in by the `rocksdb-backend` feature (issue #178) — building
# RocksDB's C++ core is real build time nobody consuming the default
# Postgres-backed provider should pay for unknowingly.
rocksdb = { workspace = true, optional = true }
# `tokio::task::spawn_blocking` is how the (synchronous) rocksdb-backend
# calls stay off the async runtime's own threads — only needed by that
# feature, `sqlx`'s own `runtime-tokio` feature covers everything else in
# this crate.
tokio = { workspace = true, optional = true }

[features]
# Off by default: nothing in this repo wires this backend up yet
# (avalon-server still uses PostgresSettlementProvider). Enable explicitly
# with `--features rocksdb-backend` to build/test it.
rocksdb-backend = ["dep:rocksdb", "dep:tokio"]

[dev-dependencies]
dotenvy.workspace = true
tokio.workspace = true
tempfile.workspace = true
