[package]
name = "avalon-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Avalon Protocol shared domain types and traits: identity, guilds, achievements, attestations, permissions, events. Pure types only — no I/O, no storage, no network calls."

[dependencies]
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
thiserror.workspace = true
base64.workspace = true
# Issue #723: domain types that appear directly in the SDK-facing OpenAPI
# schema's response/request bodies (e.g. `identity::Genre`) need
# `ToSchema` too — this is still a pure derive, no I/O added.
utoipa.workspace = true
# STH (Signed Tree Head) signing/verification (issue #773, moved from
# `avalon-chain` so the SDK doesn't need chain's full Postgres stack just
# for this pure Ed25519 signing scheme).
ed25519-dalek.workspace = true
hex.workspace = true

[dev-dependencies]
rand.workspace = true
