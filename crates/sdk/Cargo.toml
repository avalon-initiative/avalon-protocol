[package]
name = "avalon-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust reference SDK for integrating a game with Avalon. Thin over avalon-protocol and the avalon-server API — never exposes internal database structures. The C# SDK (bindings/csharp) is the flagship developer-facing surface; this crate is both the reference implementation and directly usable by Rust-based games/tools."

[dependencies]
avalon-protocol = { path = "../protocol" }
# Issue #482: STH-based network trust verification reuses `chain`'s signing-
# message logic directly rather than reimplementing it.
avalon-chain = { path = "../chain" }
# Issue #386: #[derive(AvalonSchema)] — re-exported through schema.rs.
avalon-schema-derive = { path = "../schema-derive" }
async-trait.workspace = true
thiserror.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# "time" is for the device-login poll loop's backoff sleep
# (`device_login::DeviceLogin::wait`, #398).
tokio = { workspace = true, features = ["sync", "time"] }
# Achievements issuance (#34) signs attestations locally, in-process — the
# server never sees this integrator's private key, only a detached
# signature.
ed25519-dalek.workspace = true
base64.workspace = true
# Full jitter on retry backoff (issue #47).
rand.workspace = true
# Hex-decoding trust-anchor verify keys and STH signatures (issue #482).
hex.workspace = true
# `AccountSession` (#699) drives a real WebAuthn registration/login
# ceremony client-side against a virtual authenticator — the same
# `testable`-feature approach `crates/cli/src/dev_tools.rs` already proved
# for `avalon create-identity`/`avalon login`, now a runtime dependency of
# this crate rather than only a dev-dependency of its own tests.
passkey-types.workspace = true
passkey-client.workspace = true
passkey-authenticator.workspace = true
coset = "0.4"
url.workspace = true

[features]
# Exposes Session::grant_for_testing, a capability-grant escape hatch that
# has no business in a real game's build — see its doc comment in
# crates/sdk/src/lib.rs. Enabled for this crate's own tests only, below.
test-util = []

[dev-dependencies]
avalon-sdk = { path = ".", features = ["test-util"] }
tokio.workspace = true
sqlx.workspace = true
rand.workspace = true
wiremock.workspace = true

[build-dependencies]
# Must match the schemars major version typify 0.8 itself depends on
# (0.8.x) — typify's TypeSpace API takes schemars 0.8's Schema type, and a
# newer schemars major here would silently be a different, incompatible
# type.
schemars = "0.8"
serde_json.workspace = true
typify = "0.8.0"
