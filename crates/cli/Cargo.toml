[package]
name = "avalon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local dev/ops tooling: register a game, issue a test achievement, inspect the ledger, drive the milestone-1 vertical slice without a game client."

[dependencies]
avalon-protocol = { path = "../protocol" }
# The Rust SDK lives in avalon-sdks and tracks its main branch until it is pinned to a release.
avalon-sdk = { git = "https://github.com/avalon-initiative/avalon-sdks", branch = "main" }
avalon-chain = { path = "../chain" }
avalon-server = { path = "../server" }
tokio.workspace = true
sqlx.workspace = true
avalon-devenv.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64.workspace = true
hex.workspace = true
# `avalon prune-ledger` (issue #208) computes its cutoff with
# `time::OffsetDateTime` — always available, same as ed25519-dalek below,
# not gated behind `dev-tools`.
time.workspace = true
# `avalon logs export` (issue #659) — not dev-tools-gated, it's a read-only
# tool operating on a log file already on disk, safe in any build.
strip-ansi-escapes.workspace = true
regex.workspace = true
# Required (not dev-tools-gated): `avalon inspect-ledger`'s STH signature
# verification (issue #210) needs `VerifyingKey` in every build, including
# `--no-default-features` — inspect-ledger is explicitly "always available,
# in any build" (see this crate's top-level doc comment), unlike the
# dev_tools.rs commands below, which do also use ed25519-dalek (signing, not
# just verifying) for their own reasons.
ed25519-dalek.workspace = true
# Required (not dev-tools-gated), same reasoning as ed25519-dalek above:
# `avalon discover-mirror-peers` (issue #511) is a read-only ops command —
# queries a bootstrap peer's `/nodes/peers` address book, never mutates
# anything — meant to run from `make stack-up`'s Docker-only bring-up path,
# so it has to work in a `--no-default-features` build too.
reqwest.workspace = true
# Everything below is only reachable from `dev_tools.rs` (issue #175) — the
# mutating commands (`create-identity`, `login`, `register-game`) that a
# `--no-default-features` build excludes along with these dependencies
# entirely, not just their call sites.
url = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
passkey-types = { workspace = true, optional = true }
passkey-client = { workspace = true, optional = true }
passkey-authenticator = { workspace = true, optional = true }
# Already pulled in transitively via passkey-types for the COSE key format
# `Passkey::key` uses — pinned directly here too so `login`'s persisted-
# passkey (de)serialization (see dev_tools.rs) has a stable `CborSerializable`
# import to use rather than reaching into a transitive dependency.
coset = { version = "0.4", optional = true }

[dev-dependencies]
rand.workspace = true
time.workspace = true

[features]
default = ["dev-tools"]
# Local dev/test mutation commands (issue #175) — create-identity, login,
# register-game — and every dependency only they need. A production-facing
# build should be `cargo build -p avalon-cli --no-default-features`: those
# commands, and this whole dependency list, are then absent from the binary,
# not merely unreachable at runtime.
dev-tools = [
    "dep:url",
    "dep:rand",
    "dep:passkey-types",
    "dep:passkey-client",
    "dep:passkey-authenticator",
    "dep:coset",
]

[[bin]]
name = "avalon"
path = "src/main.rs"
