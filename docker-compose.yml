# Two ways to use this file:
#
# 1. Postgres only, for the native cargo dev flow (avalon-server itself runs
#    on the host, not in a container) — the
#    original, still-supported use of this file. Defaults here match
#    `.env.compose.example`'s DATABASE_URL. Bring it up with
#    `docker compose up -d postgres`, then follow
#    docs/maintainers/local-development.md.
# 2. The full stack — postgres + avalon-server, migrated and started with
#    no Rust toolchain needed on the host at all — via `make stack-up`.
#    `avalon-server`/`migrate` read `.env` like the native
#    flow does, with DATABASE_URL/AVALON_SERVER_ADDR overridden below to
#    their container-networking equivalents (the host's `localhost`/
#    `127.0.0.1` values in `.env` are meaningless inside this compose
#    network) — everything else (network id, signing key, ...) still comes
#    from `.env`, generated by `make stack-up` on first run if missing.
#    `make stack-up` layers `docker-compose.redis.yml` on top of this file
#    by default (optional Redis-backed rate limiting/
#    concurrency ceiling — see that file's own comment) — `make
#    stack-up-no-redis` uses this file alone.

services:
  postgres:
    image: postgres:16
    container_name: avalon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avalon
      POSTGRES_PASSWORD: avalon
      POSTGRES_DB: avalon
    ports:
      - "5432:5432"
    volumes:
      - avalon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalon -d avalon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations, then exits. `make stack-up` runs
  # this (`docker compose run --rm migrate`) before starting `avalon-server`
  # — not a `depends_on` of it, since a `run --rm` one-shot isn't a
  # long-running service compose would otherwise wait on the same way.
  migrate:
    build: .
    container_name: avalon-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://avalon:avalon@postgres:5432/avalon
    entrypoint: ["migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["stack"]

  # One-shot, interactive. `make stack-up`'s first-run flow
  # invokes this (`docker compose run --rm discover-mirror-peers`, before
  # `avalon-server` itself starts) so a hoster whose `AVALON_BOOTSTRAP_PEERS`
  # (or network seed list) resolves to a reachable peer gets prompted to
  # pick which discovered peer(s) to mirror, without hand-copying URLs. See
  # `crates/cli/src/main.rs::discover_mirror_peers`'s own doc comment for the
  # full skip-conditions list (already configured, nothing discoverable, no
  # TTY, ...) — every one of them prints nothing and exits 0, so this never
  # blocks a non-interactive bring-up. `stdin_open`/`tty` pass the host
  # terminal through so the interactive prompt actually works via `docker
  # compose run` (not `up` — this isn't a long-running service).
  discover-mirror-peers:
    build: .
    container_name: avalon-discover-mirror-peers
    env_file: .env
    entrypoint: ["avalon"]
    command: ["discover-mirror-peers"]
    stdin_open: true
    tty: true
    profiles: ["stack"]

  avalon-server:
    build: .
    container_name: avalon-server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://avalon:avalon@postgres:5432/avalon
      # 0.0.0.0 so the process actually accepts connections from outside
      # its own container — this is not the same exposure as binding
      # 0.0.0.0 on the host directly; the port publish below is what
      # controls host-side reachability. Bound to this host's LAN IP (via
      # AVALON_HOST_IP, not 0.0.0.0) so a peer node on the same LAN can
      # reach it. Defaults to loopback-only if unset, matching the native
      # dev flow's 127.0.0.1:8080 default (see .env.example).
      AVALON_SERVER_ADDR: 0.0.0.0:8080
    ports:
      - "${AVALON_HOST_IP:-127.0.0.1}:8080:8080"
      # Only meaningful when AVALON_DHT_ENABLED=true and
      # AVALON_LIBP2P_LISTEN_ADDR binds this same port inside the
      # container (e.g. /ip4/0.0.0.0/tcp/4001) — a harmless unused publish
      # otherwise. Same AVALON_HOST_IP posture as the port above: a peer on
      # another host needs this published on the real LAN IP, and
      # AVALON_LIBP2P_EXTERNAL_ADDR set to that same reachable address —
      # see crate::dht's module doc for why the container can't safely
      # self-detect it.
      - "${AVALON_HOST_IP:-127.0.0.1}:4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["stack"]

volumes:
  avalon-postgres-data:
